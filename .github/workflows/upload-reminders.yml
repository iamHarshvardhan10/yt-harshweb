# Hourly job: emails a reminder about a day before each scheduled upload, sends
# newsletter campaigns whose scheduled time has passed, and sends the comment
# digest / weekly summary when they're turned on in Settings → Notifications.
#
# Calls the site's /api/cron/reminders every hour; the site decides what's due
# and never sends the same email twice.
#
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#   SITE_URL      the deployed site, e.g. https://harshbhosale.com (no trailing slash)
#   CRON_SECRET   the same value as CRON_SECRET in the site's environment
#
# GitHub may start scheduled runs a few minutes late, and pauses schedules in
# repos with no activity for 60 days. "Run workflow" on the Actions tab runs it now.

name: Upload reminders

on:
  schedule:
    - cron: "7 * * * *" # every hour at :07 (off the busy top of the hour)
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the SITE_URL and CRON_SECRET repository secrets"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/reminders"
